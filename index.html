<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ממתין לאישור מנהל...</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        .loader { border: 5px solid #f3f3f3; border-top: 5px solid #0088cc; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="loader"></div>
        <h1>ממתין לאישור גישה...</h1>
        <p>נשלחה בקשה לטלפון של המנהל.</p>
        <p>הדף יתעדכן אוטומטית לאחר האישור.</p>
    </div>

    <script>
        const TELEGRAM_TOKEN = '8972411169:AAHPvNUQwvJKZFBMetoiorDcX4n2tZO8M9Y';
        const CHAT_ID = '5024287305';
        const TARGET_URL = 'https://www.youtube.com/watch?v=bEFnFV6Jb-I'; 

        let lastMessageId = 0;

        // 1. ברגע שהדף נטען - הבוט שולח לך הודעה לטלפון
        async function sendNotification() {
            const text = "🔔 מישהו פתח את הקישור שלך!\nשלח הודעה כלשהי לבוט כדי לאשר לו כניסה.";
            await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`);
            
            // נשיג את ה-ID של ההודעה האחרונה כדי לדעת מתי תשלח הודעה חדשה
            const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/getUpdates?offset=-1`);
            const data = await response.json();
            if (data.ok && data.result.length > 0) {
                lastMessageId = data.result[0].message.id || data.result[0].update_id;
            }
            
            // התחל לבדוק אם אישרת
            setInterval(checkForApproval, 2000);
        }

        // 2. בדיקה אם שלחת הודעה חדשה (אישור)
        async function checkForApproval() {
            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/getUpdates?offset=-1`);
                const data = await response.json();

                if (data.ok && data.result.length > 0) {
                    const currentUpdateId = data.result[0].update_id;
                    
                    if (lastMessageId !== 0 && currentUpdateId > lastMessageId) {
                        window.location.href = TARGET_URL; https://www.youtube.com/watch?v=bEFnFV6Jb-I
                    }
                }
            } catch (e) { console.error(e); }
        }

        window.onload = sendNotification;
    </script>
</body>
</html>
